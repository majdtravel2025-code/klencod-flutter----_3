}

android {
    namespace 'com.madinati.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'com.madinati.mobile'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
}

flutter { source '../..' }
